# Production deployment compose.
#
# Requires a .env file in the same directory (copy from .env.prod.example):
#   cp .env.prod.example .env
#   # Edit .env with real credentials
#
# Build and start:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Run database migrations after first deploy:
#   docker compose -f docker-compose.prod.yml exec app php vendor/bin/sake dev/build flush=1

services:
  app:
    build:
      context: .
      target: prod
    ports:
      - "${APP_PORT:-80}:80"
    env_file: .env
    volumes:
      # Only uploaded assets are persisted; everything else is baked into the image
      - assets:/var/www/html/public/assets
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      # These reference variables from the .env file via Docker Compose interpolation
      MYSQL_ROOT_PASSWORD: ${SS_DATABASE_ROOT_PASSWORD}
      MYSQL_DATABASE: ${SS_DATABASE_NAME}
      MYSQL_USER: ${SS_DATABASE_USERNAME}
      MYSQL_PASSWORD: ${SS_DATABASE_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${SS_DATABASE_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
  assets:
