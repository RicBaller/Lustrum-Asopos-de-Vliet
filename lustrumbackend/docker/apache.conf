# ── Reverse-proxy trust (Traefik / Dokploy) ─────────────────────────────────
# When Traefik terminates TLS it sends X-Forwarded-Proto: https.
# We set the HTTPS env var so PHP/SilverStripe generates https:// URLs.
<IfModule mod_setenvif.c>
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
</IfModule>

<IfModule mod_remoteip.c>
    RemoteIPHeader X-Forwarded-For
    # Trust any Docker/private network range
    RemoteIPInternalProxy 10.0.0.0/8
    RemoteIPInternalProxy 172.16.0.0/12
    RemoteIPInternalProxy 192.168.0.0/16
</IfModule>

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Disable PHP execution in the assets folder (uploaded files)
    <LocationMatch "^/assets/">
        php_flag engine off
    </LocationMatch>

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
